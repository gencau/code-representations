hydra:
  job:
    name: ${backbone.name}_${backbone.model_name}_${backbone.experiment}
  run:
    dir: /Users/gen/workspace/emse_2027/code-representations/discussion/rq2_extension/output/${hydra:job.name}${run_suffix}
  job_logging:
    root:
      handlers: [console, file]
backbone:
  # Switch to a backbone implementation that uses the Ollama API.
  _target_: src.baselines.backbones.agent.ollama_agent_backbone.OllamaAgentBackbone
  name: devstral-agent
  # This is the model identifier as recognized by Ollama.
  model_name: devstral-small-2-16k

  prompt:
    _target_: src.baselines.backbones.agent.prompts.agent_bug_summary_prompt.AgentBugSummaryPrompt

  retriever:
    _target_: src.baselines.backbones.agent.context.summary_retriever.SummaryRetriever
    # Same bug-report summary database as the Qwen 7B/14B/32B bugreports runs (T9 path now has the lca/ level)
    database_location: "/Volumes/T9/rq1/summaries/lca/queries/file-level/report3/temp0/all/queries_5_test_gtelarge"
  experiment: bugreports

data_source:
  _target_: src.baselines.data_sources.hf_data_source.HFDataSource
  repos_dir: /Volumes/T9/lca/cloned_repos
  cache_dir: null
  hub_name: tiginamaria/bug-localization
  configs:
    - py
    - java
    - kt
  split: test

run_suffix: ""
